<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="language" content="ru">
    <title>Студент КГУ</title>
    <meta name="description" content="">
    <link type="image/x-icon" href="favicon.ico" rel="shortcut icon">
    <link type="Image/x-icon" href="favicon.ico" rel="icon">
    <meta name="version" content="alpha 2.0">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <!-- Совместимость с IOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/logo/192x192.png">

    <!-- Импорты стилей -->
    <link rel="stylesheet" href="styles/fonts/fonts.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="styles/ui.css">
    <link rel="stylesheet" href="styles/pages/kafeder.css">
    <link rel="stylesheet" href="styles/pages/materials.css">
    <link rel="stylesheet" href="styles/pages/shedule.css">
    <link rel="stylesheet" href="styles/pages/messager.css">
    <link rel="stylesheet" href="styles/pages/account.css">
</head>

<body id="body">
    <!-- Контейнер уведомлений -->
    <div id="notifications"></div>

    <!-- Контейнер загрузки контента -->
    <div id="container-loading" class="hidden"></div>

    <!-- Контейнер авторизации -->
    <div id="auth" class="relative-container hidden">
        <div id="background-auth"></div>
        <div id="auth-wrapper"><div class="relative-container">
            <div id="auth-logo-container" class="flex-container"> <!-- Логотип окна авторизации -->
                <img id="auth-logo-image" src="images/logo/logo.png" />
                <h1 id="auth-logo-header">Студент</h1>
            </div>
            <div id="auth-container"> <!-- Контейнер наполнителя окна авторизации -->

                <form id="register-form"> <!-- Форма регистрации -->
                    <h2>Регистрация</h2>
                    <p>Создайте аккаунт для доступа ко всем возможностям сервиса</p>
                    <div class="form-group"> <!-- Ввод полного имени пользователя -->
                        <div class="input-wrapper">
                            <input type="text" id="auth-input-registerUsername" name="username" required>
                            <label for="auth-input-registerUsername">Логин (публичное имя)</label><span class="focus-border"></span>
                        </div>
                    </div>
                    <div class="form-group"> <!-- Ввод адреса электронной почты -->
                        <div class="input-wrapper">
                            <input type="email" id="auth-input-registerEmail" name="email" required>
                            <label for="auth-input-registerEmail">Электронная почта</label><span class="focus-border"></span>
                        </div>
                    </div>
                    <div class="form-group"> <!-- Ввод пароля -->
                        <div class="input-wrapper">
                            <input type="password" id="auth-input-registerPassword" name="password" required>
                            <label for="auth-input-registerPassword">Пароль</label><span class="focus-border"></span>
                            <button type="button" class="password-toggle" id="auth-register-passwordToggle">
                                <span class="eye-icon"></span>
                            </button>
                        </div>
                    </div>
                    <div class="form-group"> <!-- Повторный ввод пароля -->
                        <div class="input-wrapper">
                            <input type="password" id="auth-input-registerPasswordAgain" name="passwordAgain" required>
                            <label for="auth-input-registerPasswordAgain">Повторите пароль</label><span class="focus-border"></span>
                            <button type="button" class="password-toggle" id="auth-register-passwordAgainToggle">
                                <span class="eye-icon"></span>
                            </button>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="remember-wrapper">
                            <input type="checkbox" id="auth-chechmark-policy" name="policy">
                            <span class="checkbox-label">
                                <span class="checkmark"></span> Я ознакомился(ась) с политикой конфиденциальности и принимаю ее
                            </span>
                        </label>
                    </div>
                    <button type="submit" class="auth-submit-button">Зарегистрироваться</button>
                    <button id="auth-button-guestMode1" class="guest-button">Продолжить в гостевом режиме</button>
                    <div class="flex-container">
                        <p>Уже есть аккаунт?</p>
                        <button id="auth-button-toggleLogin" class="auth-supbutton">Войдите</button>
                    </div>
                </form>

                <form id="login-form" class="form-hidden"> <!-- Форма входа в аккаунт -->
                    <h2>Вход</h2>
                    <p>Войдите в существующий аккаунт</p>
                    <div class="form-group"> <!-- Ввод адреса электронной почты -->
                        <div class="input-wrapper">
                            <input type="email" id="auth-input-loginEmail" name="email" required>
                            <label for="auth-input-loginEmail">Электронная почта</label><span class="focus-border"></span>
                        </div>
                    </div>
                    <div class="form-group"> <!-- Ввод пароля -->
                        <div class="input-wrapper">
                            <input type="password" id="auth-input-loginPassword" name="password" required>
                            <label for="auth-input-loginPassword">Пароль</label><span class="focus-border"></span>
                            <button type="button" class="password-toggle" id="auth-login-passwordToggle">
                                <span class="eye-icon"></span>
                            </button>
                        </div>
                    </div>
                    <div class="flex-container" style="margin-top: -15px !important">
                        <p>Забыли пароль?</p>
                        <button id="auth-button-recoverPassword" class="auth-supbutton">Восстановить</button>
                    </div>
                    <button type="submit" class="auth-submit-button">Войти</button>
                    <button id="auth-button-guestMode2" class="guest-button">Продолжить в гостевом режиме</button>
                    <div class="flex-container">
                        <p>Нет аккаунта?</p>
                        <button id="auth-button-toggleRegister" class="auth-supbutton">Регистрация</button>
                    </div>
                </form>

                <form id="additional-form" class="form-hidden"> <!-- Форма заполнения студенческой информации -->
                    <h2>Дополнительно</h2>
                    <p>Заполните поля ниже, чтобы персонализировать студенческое приложение</p>
                    <div class="group-selector"> <!-- Ввод группы студента -->
                        <div class="form-group">
                            <div class="input-wrapper">
                                <input type="text" id="auth-input-group" name="group" readonly required>
                                <label for="auth-input-loginEmail">Группа</label><span class="focus-border"></span>
                            </div>
                        </div>
                        <div id="groupDropdown" class="group-dropdown">
                            <div id="dropdownContent" class="dropdown-content"></div>
                        </div>
                    </div>
                    
                    <div class="group-selector"> <!-- Ввод подгруппы студента -->
                        <div class="form-group">
                            <div class="input-wrapper">
                                <input type="text" id="auth-input-group" name="group" readonly required>
                                <label for="auth-input-loginEmail">Подгруппа</label><span class="focus-border"></span>
                            </div>
                        </div>
                    </div>

                    
                    <button type="submit" class="auth-submit-button">Завершить</button>
                    <button id="auth-button-backOnTrack" class="auth-supbutton">Вернуться к регистрации</button>
                </form>
            
            </div>
        </div></div>
    </div>

    <!-- Контейнер сессии -->
    <div id="session" class="relative-container hidden">
        <div id="background-session"></div>

        <!-- Нижняя панель навигации закрепленного интерфейса -->
        <div id="filter-bottom"></div>
        <div id="nav">
            <div class="nav-element" id="nav-kafeder">
                <img src="images/ui/graduation-cap.png" />
            </div>
            <div class="nav-element" id="nav-homework">
                <img src="images/ui/work.png" />
            </div>
            <div class="nav-element" id="nav-shedule">
                <img src="images/ui/schedule.png" />
            </div>
            <div class="nav-element" id="nav-messager">
                <img src="images/ui/messager.png" />
            </div>
            <div class="nav-element" id="nav-account">
                <img src="images/ui/phone.png" />
            </div>
        </div>

        <!-- Верхняя панель закрепленного интерфейса -->
        <div id="filter-top"></div>
        <div id="header-left">
            <p><span id="header-name">🔑 Режим теста</span></p>
        </div>
        <div id="header-right">
            <p id="header-group-p"><span id="header-group">26-ИСбо-4</span></p>
            <div class="header-button" id="header-notifications">
                <img src="images/ui/notification.png" />
            </div>
            <div class="header-button" id="header-web">
                <img src="images/ui/web.png" />
            </div>
        </div>

        <!-- Контейнеры наполнителей контента  -->
        <div id="container"></div>
        <!-- Основной контейнер наполнителя контента -->
        <div id="container-translate"></div>
        <!-- Контейнер анимации перелистывания страницы -->
        <div id="container-upwards" class="hidden"></div>
        <!-- Контейнер перекрывающего содержимого (suppages) -->
    </div>

    <!-- Библиотеки и функции Firebase -->
    <script src="libs/firebase/firebase-app.js"></script>
    <script src="libs/firebase/firebase-auth.js"></script>
    <script src="libs/firebase/firebase-firestore.js"></script>
    <script src="libs/config.js"></script>
    <script src="libs/auth-logic.js"></script>

    <!-- Постоянные данные приложения -->
    <script src="scripts/data/teachers.js"></script>
    <script src="scripts/data/groups.js"></script>
    <script src="scripts/data/rooms.js"></script>

    <!-- Основная логика -->
    <script src="scripts/ui.js"></script>

</body>

</html>
