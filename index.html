<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
        <meta name="language" content="ru">
		<title>Студенческий портал | ИВИТШ КГУ</title>
		<meta name="description" content="">
        <link type="image/x-icon" href="favicon.ico" rel="shortcut icon">
        <link type="Image/x-icon" href="favicon.ico" rel="icon">
        <meta name="version" content="alpha 2.0">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

		<!-- Импорты стилей -->
		<link rel="stylesheet" href="styles/fonts.css"> <!-- Шрифты приложения -->
		<link rel="stylesheet" href="styles/main.css">  <!-- Общая стилизация -->
	</head>
	<body>
		<!-- ✓ Элементы заднего фона -->
		<div id="background"></div>

		<!-- ✓ Нижняя панель навигации закрепленного интерфейса -->
		<div id="filter-bottom"></div>
		<div id="nav">
			<div class="nav-element" id="nav-kafeder">
				<img src="images/ui/graduation-cap.png" />
			</div>
			<div class="nav-element" id="nav-homework">
				<img src="images/ui/work.png" />
			</div>
			<div class="nav-element" id="nav-shedule">
				<img src="images/ui/schedule.png" />
			</div>
			<div class="nav-element" id="nav-messager">
				<img src="images/ui/messager.png" />
			</div>
			<div class="nav-element" id="nav-services">
				<img src="images/ui/apps.png" />
			</div>
		</div>

		<!-- ✓ Верхняя панель закрепленного интерфейса -->
		<div id="filter-top"></div>
		<div id="header-left">
			<img class="header-avatar" src="images/male.jpg" />
			<p><span id="header-name">Даниил Соловьев</span></p>
		</div>
		<div id="header-right">
			<p id="header-group-p"><span id="header-group">26-ИСбо-4</span></p>
			<div class="header-button" id="header-notifications">
				<img src="images/ui/notification.png" />
			</div>
			<div class="header-button" id="header-settings">
				<img src="images/ui/web.png" />
			</div>
		</div>

		<!-- Основной контейнер наполнителя -->
		<div id="container">
			<div class="relative-container" id="subcontainer">
				<div class="flex-container info-container">
					<div class="banner-half">
						<h3>Расписание</h3>
						<p>Разраб кнопки не доделал, радуйтесь тому что есть</p>
						<div class="flex-container radio-container" style="justify-content: start !important;">
							<button id="shedule-day" class="radio-button" onclick="switchSchedule('day')">День</button>
							<button id="shedule-week" class="radio-button" onclick="switchSchedule('week')">Неделя</button>
						</div>
					</div>
					<img class="banner-half" src="images/supbanners/note.png"/>
				</div>
				<div id="shedule-container">

				</div>
			</div>
		</div>
		
		<script defer src="scripts/ui.js"></script>
	</body>
</html>
